name: ACEest CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]

jobs:
  build-test-and-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Stage 1 - Build & Lint (Install dependencies and Flake8)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Compile check - verify Python files parse without errors
          python -m py_compile app.py
          echo "Compilation successful"
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Stage 2 - Docker Image Assembly
        run: |
          docker build -t aceest-gym:${{ github.sha }} -t aceest-gym:latest .

      - name: Stage 3 - Automated Testing
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=. --cov-report=xml

      - name: Stage 4 - SonarCloud Code Quality Analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Stage 5 - Push to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Stage 5 - Tag and Push
        run: |
          docker tag aceest-gym:${{ github.sha }} chetan56881/aceest-fitness-app:gha-${{ github.run_number }}
          docker tag aceest-gym:${{ github.sha }} chetan56881/aceest-fitness-app:latest-gha
          docker push --all-tags chetan56881/aceest-fitness-app
