apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-app
  template:
    metadata:
      labels:
        app: aceest-fitness-app
    spec:
      containers:
      - name: aceest-fitness-app
        image: chetan56881/aceest-fitness-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-app
spec:
  type: LoadBalancer
  selector:
    app: aceest-fitness-app
  ports:
  - port: 5000
    targetPort: 5000
